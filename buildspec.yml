version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing Python dependencies..."
      - python -m pip install --upgrade pip
      - pip install -r requirements.txt
  build:
    commands:
      - echo "Running static files collection with exact python environment..."
      - python manage.py collectstatic --noinput
artifacts:
  files:
    - '**/*'
