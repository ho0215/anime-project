version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Installing system dependencies for mysqlclient..."
      - apt-get update -y && apt-get install -y pkg-config default-libmysqlclient-dev build-essential
      - echo "Installing Python dependencies..."
      - python -m pip install --upgrade pip
      - pip install -r requirements.txt
  build:
    commands:
      - echo "Running static files collection..."
      - python manage.py collectstatic --noinput
artifacts:
  files:
    - '**/*'
