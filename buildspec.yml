version: 0.2
env:
  variables:
    MYSQLCLIENT_CFLAGS: "-I/usr/include/mysql"
    MYSQLCLIENT_LDFLAGS: "-L/usr/lib64/mysql -lmysqlclient"
phases:
  install:
    commands:
      - echo "Checking OS release..."
      - cat /etc/os-release
      - echo "Installing newer MariaDB devel via amazon-linux-extras..."
      - /usr/bin/python2 /usr/bin/amazon-linux-extras install -y mariadb10.5 || /usr/bin/python3 /usr/bin/amazon-linux-extras install -y mariadb10.5
      - yum install -y pkgconfig mariadb-devel gcc python3-devel
      - echo "Creating virtual environment..."
      - python -m venv venv
      - echo "Installing dependencies..."
      - venv/bin/pip install --upgrade pip
      - venv/bin/pip install -r requirements.txt
  build:
    commands:
      - echo "Running collectstatic using venv python..."
      - venv/bin/python manage.py collectstatic --noinput
artifacts:
  files:
    - '**/*'
