version: 0.2

phases:
  install:
    commands:
      - echo "Installing build dependencies for Ubuntu..."
      - apt-get update && apt-get install -y default-libmysqlclient-dev build-essential pkg-config python3-dev python3-venv
      - echo "Creating virtual environment..."
      - python3 -m venv venv
  pre_build:
    commands:
      - echo "Nothing to do in pre_build"
  build:
    commands:
      - echo "Running pip install and collectstatic..."
      - venv/bin/pip install --upgrade pip
      - venv/bin/pip install -r requirements.txt
      - venv/bin/python manage.py collectstatic --noinput
  post_build:
    commands:
      - echo "Build completed on `date`"

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - 'venv/**/*'
    - '.venv/**/*'
