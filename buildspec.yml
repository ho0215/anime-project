version: 0.2
env:
  variables:
    MYSQLCLIENT_CFLAGS: "-I/usr/include/mysql"
    MYSQLCLIENT_LDFLAGS: "-L/usr/lib64/mysql -lmysqlclient"
phases:
  install:
    commands:
      - echo "Adding MariaDB official repo..."
      - curl -LsS https://r.mariadb.com/downloads/mariadb_repo_setup | bash -s -- --mariadb-server-version="mariadb-10.11"
      - echo "Installing MariaDB devel packages..."
      - yum install -y MariaDB-devel MariaDB-shared pkgconfig gcc python3-devel
      - echo "Creating virtual environment..."
      - python -m venv venv
      - echo "Installing dependencies..."
      - venv/bin/pip install --upgrade pip
      - venv/bin/pip install -r requirements.txt
  build:
    commands:
      - echo "Running collectstatic using venv python..."
      - venv/bin/python manage.py collectstatic --noinput
artifacts:
  files:
    - '**/*'
