version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "=== Available pyenv versions ==="
      - pyenv versions
      - echo "=== Setting pyenv global to any installed 3.11.x ==="
      - export PYENV_VERSION=$(pyenv versions --bare | grep '^3\.11' | tail -1)
      - echo "Using python version: $PYENV_VERSION"
      - pyenv global $PYENV_VERSION
      - pyenv rehash
      - echo "=== Creating virtual environment ==="
      - python3 -m venv venv
      - echo "=== Installing dependencies into venv ==="
      - venv/bin/pip install --upgrade pip
      - venv/bin/pip install -r requirements.txt
      - echo "=== Installed packages ==="
      - venv/bin/pip freeze
      - echo "=== Python version ==="
      - venv/bin/python --version
  build:
    commands:
      - echo "Running collectstatic using venv python..."
      - venv/bin/python manage.py collectstatic --noinput
artifacts:
  files:
    - '**/*'
