# Local stack: app (Daphne) + MariaDB
# Usage:
#   cp .env.docker.example .env
#   docker compose up --build
#
# 일반 Docker Desktop/Linux: DB_HOST=db (기본)
# 브리지 컨테이너↔컨테이너가 막힌 환경: COMPOSE_DB_HOST=host.docker.internal COMPOSE_DB_PORT=3307
services:
  db:
    image: mariadb:11.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-aniverse}
      MYSQL_USER: ${DB_USER:-aniverse}
      MYSQL_PASSWORD: ${DB_PASSWORD:-aniversepass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    ports:
      - "3307:3306"
    volumes:
      - aniverse_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: aniverse:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: ${COMPOSE_DB_HOST:-db}
      DB_PORT: ${COMPOSE_DB_PORT:-3306}
      RUN_MIGRATE: "true"
      RUN_COLLECTSTATIC: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  aniverse_db_data:
