version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/aniverse
permissions:
  - object: /home/ubuntu/aniverse
    owner: ubuntu
    group: ubuntu
hooks:
  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: ubuntu
  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 120
      runas: ubuntu
