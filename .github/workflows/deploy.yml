name: Django CD Pipeline (CodeDeploy)

# Run workflow 버튼은 기본 브랜치(main)에 workflow_dispatch 가 있어야 보임.
# 머지 전 테스트용으로 feature 브랜치 push 에도 동작하게 함.
on:
  push:
    branches:
      - main
      - cursor/terraform-cicd-automation
  workflow_dispatch:
    inputs:
      restore_db:
        description: "SSM으로 data/aniverse_backup.sql 을 RDS에 복원"
        type: boolean
        default: false
      inject_gemini:
        description: "SSM으로 GEMINI_API_KEY 를 EC2 .env 에 주입 후 재시작"
        type: boolean
        default: true

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
  CODE_DEPLOY_APP_NAME: ${{ vars.CODE_DEPLOY_APP_NAME || 'aniverse-app' }}
  CODE_DEPLOY_GROUP_NAME: ${{ vars.CODE_DEPLOY_GROUP_NAME || 'aniverse-deployment-group' }}
  ASG_NAME: aniverse-asg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync media to public S3 bucket
        env:
          # vars/secret 없으면 현재 dev 버킷명 사용 (스크립트가 aniverse-static* 자동탐색도 함)
          STATIC_BUCKET_NAME: ${{ vars.STATIC_BUCKET_NAME }}
        run: |
          chmod +x scripts/sync_media_to_s3.sh
          if [ -z "${STATIC_BUCKET_NAME:-}" ]; then
            export STATIC_BUCKET_NAME="aniverse-static-ho0215-dev-2026-679583587966-ap-northeast-2"
          fi
          bash scripts/sync_media_to_s3.sh

      - name: Package application
        run: |
          zip -r deploy.zip . \
            -x "*.git*" \
            -x "*venv*" \
            -x "*.cursor*" \
            -x "*__pycache__*" \
            -x "*.pyc" \
            -x "mydb_backup.sql" \
            -x "media/*" \
            -x "media (2)/*" \
            -x "staticfiles/*" \
            -x ".env"

      - name: Upload artifact to S3
        run: aws s3 cp deploy.zip "s3://${S3_BUCKET_NAME}/deploy.zip"

      - name: Wait for any in-progress CodeDeploy to finish
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            ACTIVE=$(aws deploy list-deployments \
              --application-name "$CODE_DEPLOY_APP_NAME" \
              --deployment-group-name "$CODE_DEPLOY_GROUP_NAME" \
              --include-only-statuses Created Queued InProgress \
              --query 'deployments[0]' --output text)
            if [ -z "$ACTIVE" ] || [ "$ACTIVE" = "None" ]; then
              echo "No active CodeDeploy deployments."
              exit 0
            fi
            echo "Active deployment $ACTIVE — waiting ($i/60)..."
            sleep 15
          done
          echo "Timed out waiting for active deployment; stopping it."
          ACTIVE=$(aws deploy list-deployments \
            --application-name "$CODE_DEPLOY_APP_NAME" \
            --deployment-group-name "$CODE_DEPLOY_GROUP_NAME" \
            --include-only-statuses Created Queued InProgress \
            --query 'deployments[0]' --output text)
          if [ -n "$ACTIVE" ] && [ "$ACTIVE" != "None" ]; then
            aws deploy stop-deployment --deployment-id "$ACTIVE" --auto-rollback-enabled || true
            sleep 20
          fi

      - name: Ensure CodeDeploy agent is active on ASG instances
        run: |
          set -uo pipefail
          # GitHub Actions IAM 에 ssm:SendCommand 가 없으면 여기서 실패함.
          # 에이전트는 로컬/SSM 세션으로 이미 켜 둔 경우가 많으므로, 실패해도 배포는 진행.
          REMOTE='set -eux; export DEBIAN_FRONTEND=noninteractive; command -v ruby >/dev/null || (apt-get update -y && apt-get install -y ruby-full wget); if [ ! -d /opt/codedeploy-agent ]; then cd /tmp && wget -q https://aws-codedeploy-ap-northeast-2.s3.ap-northeast-2.amazonaws.com/latest/install -O install && chmod +x install && ./install auto; fi; systemctl enable codedeploy-agent || true; systemctl restart codedeploy-agent || systemctl start codedeploy-agent || true; sleep 2; systemctl is-active codedeploy-agent'

          OK=0
          TOTAL=0
          SSM_OK=0
          IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text || true)

          if [ -z "${IDS// /}" ]; then
            echo "WARNING: no InService ASG instances; proceeding to create-deployment" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for id in $IDS; do
            TOTAL=$((TOTAL + 1))
            PARAMS=$(jq -nc --arg c "$REMOTE" '{commands:[$c]}' 2>/dev/null || echo "")
            if [ -z "$PARAMS" ]; then
              echo "$id: jq missing; skip SSM ensure"
              continue
            fi
            set +e
            CMD_ID=$(aws ssm send-command \
              --instance-ids "$id" \
              --document-name "AWS-RunShellScript" \
              --parameters "$PARAMS" \
              --timeout-seconds 300 \
              --query 'Command.CommandId' --output text 2>/tmp/ssm-err.txt)
            RC=$?
            set -e
            if [ $RC -ne 0 ] || [ -z "$CMD_ID" ] || [ "$CMD_ID" = "None" ]; then
              echo "$id: SSM send-command failed (often missing ssm:SendCommand on CI IAM)"
              cat /tmp/ssm-err.txt 2>/dev/null || true
              continue
            fi
            SSM_OK=$((SSM_OK + 1))
            for _ in $(seq 1 40); do
              ST=$(aws ssm get-command-invocation \
                --command-id "$CMD_ID" --instance-id "$id" \
                --query 'Status' --output text 2>/dev/null || echo Pending)
              if [ "$ST" = "Success" ] || [ "$ST" = "Failed" ] || [ "$ST" = "Cancelled" ] || [ "$ST" = "TimedOut" ]; then
                break
              fi
              sleep 3
            done
            OUT=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$id" \
              --query 'StandardOutputContent' --output text 2>/dev/null || echo "")
            echo "$id: $OUT"
            if echo "$OUT" | grep -q '^active'; then
              OK=$((OK + 1))
            fi
          done

          echo "Agents confirmed active via SSM: $OK / $TOTAL (ssm ok: $SSM_OK)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$OK" -lt "$TOTAL" ]; then
            echo "WARNING: could not verify all agents via SSM. If you already started codedeploy-agent on the instances, deploy will continue." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # 게이트로 막지 않음 — create-deployment 가 실제 실패를 보여 줌
          exit 0

      - name: Create CodeDeploy deployment
        id: deploy
        run: |
          DEPLOY_ID=$(aws deploy create-deployment \
            --application-name "$CODE_DEPLOY_APP_NAME" \
            --deployment-config-name CodeDeployDefault.AllAtOnce \
            --deployment-group-name "$CODE_DEPLOY_GROUP_NAME" \
            --s3-location "bucket=${S3_BUCKET_NAME},bundleType=zip,key=deploy.zip" \
            --ignore-application-stop-failures \
            --query deploymentId \
            --output text)
          echo "deployment_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment ID: $DEPLOY_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for deployment to succeed
        id: wait
        run: |
          aws deploy wait deployment-successful --deployment-id "${{ steps.deploy.outputs.deployment_id }}"
          echo "Deployment succeeded" >> "$GITHUB_STEP_SUMMARY"

      - name: Dump CodeDeploy failure details
        if: failure() && steps.deploy.outputs.deployment_id != ''
        run: |
          DID="${{ steps.deploy.outputs.deployment_id }}"
          echo "### CodeDeploy failure ($DID)" >> "$GITHUB_STEP_SUMMARY"
          aws deploy get-deployment --deployment-id "$DID" \
            --query 'deploymentInfo.{status:status,error:errorInformation}' \
            --output json | tee /tmp/cd-dep.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/cd-dep.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for tid in $(aws deploy list-deployment-targets --deployment-id "$DID" --query 'targetIds[]' --output text); do
            echo "---- target $tid ----" | tee -a "$GITHUB_STEP_SUMMARY"
            aws deploy get-deployment-target --deployment-id "$DID" --target-id "$tid" \
              --query 'deploymentTarget.instanceTarget.lifecycleEvents[?status==`Failed`].[lifecycleEventName,diagnostics.logTail]' \
              --output text | tee -a "$GITHUB_STEP_SUMMARY" || true
          done

      - name: Resolve ASG instance IDs
        id: instances
        if: success()
        run: |
          IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query "AutoScalingGroups[0].Instances[?LifecycleState=='InService'].InstanceId" \
            --output text)
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"
          echo "InService instances: $IDS" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$IDS" ] || [ "$IDS" = "None" ]; then
            echo "No InService ASG instances found" >&2
            exit 1
          fi

      - name: Inject GEMINI_API_KEY via SSM (existing instances)
        if: >
          success() &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.inject_gemini))
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY secret is empty — skip inject." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "Add repo secret GEMINI_API_KEY (Google AI Studio key) then re-run deploy." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          export GEMINI_API_KEY
          # AWS-RunShellScript 기본 셸은 dash → 전체 스크립트를 base64로 감싸 bash 로 실행
          python3 <<'PY'
          import base64, json, os
          key = os.environ["GEMINI_API_KEY"]
          key_b64 = base64.b64encode(key.encode()).decode()
          script = f"""set -euo pipefail
          KEY=$(printf %s '{key_b64}' | base64 -d)
          python3 /home/ubuntu/aniverse/scripts/set_env_key.py --key GEMINI_API_KEY --value "$KEY" /home/ubuntu/aniverse/.env /etc/aniverse.env
          python3 /home/ubuntu/aniverse/scripts/set_env_key.py --key GEMINI_MODEL --value gemini-3.6-flash /home/ubuntu/aniverse/.env /etc/aniverse.env
          chown ubuntu:ubuntu /home/ubuntu/aniverse/.env
          chmod 600 /home/ubuntu/aniverse/.env /etc/aniverse.env
          systemctl restart aniverse.service
          sleep 3
          systemctl is-active aniverse.service
          unset KEY
          """
          # dedent-ish: strip leading spaces from each line for cleaner bash
          script = "\n".join(line.lstrip() for line in script.splitlines()) + "\n"
          script_b64 = base64.b64encode(script.encode()).decode()
          params = {"commands": [f"echo {script_b64} | base64 -d | bash"]}
          with open("/tmp/ssm-gemini-params.json", "w", encoding="utf-8") as f:
              json.dump(params, f)
          PY
          for ID in ${{ steps.instances.outputs.ids }}; do
            echo "Injecting GEMINI_API_KEY on $ID"
            CMD_ID=$(aws ssm send-command \
              --instance-ids "$ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Inject GEMINI_API_KEY and restart aniverse" \
              --parameters "file:///tmp/ssm-gemini-params.json" \
              --query Command.CommandId --output text)
            aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$ID" || true
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json | tee "/tmp/gemini-$ID.json"
            STATUS=$(python3 -c "import json;print(json.load(open('/tmp/gemini-$ID.json'))['Status'])")
            if [ "$STATUS" != "Success" ]; then
              echo "GEMINI inject failed on $ID status=$STATUS" >&2
              exit 1
            fi
          done
          echo "GEMINI_API_KEY injected on ASG instances" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore DB from SQL dump via SSM
        if: >
          success() &&
          (contains(github.event.head_commit.message, '[restore-db]') ||
           (github.event_name == 'workflow_dispatch' && inputs.restore_db))
        run: |
          set -euo pipefail
          # RDS 는 공유 리소스 — ASG 인스턴스 중 하나에서만 복원
          ID=$(echo "${{ steps.instances.outputs.ids }}" | awk '{print $1}')
          echo "Restoring DB on $ID only"
          # AWS-RunShellScript 기본 셸은 dash(/bin/sh) → bash -lc 로 실행
          python3 <<'PY'
          import json
          params = {
              "commands": [
                  "bash -lc 'set -euo pipefail; chmod +x /home/ubuntu/aniverse/scripts/restore_db.sh; bash /home/ubuntu/aniverse/scripts/restore_db.sh'"
              ]
          }
          with open("/tmp/ssm-restore-params.json", "w", encoding="utf-8") as f:
              json.dump(params, f)
          PY
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Restore aniverse_backup.sql to RDS" \
            --timeout-seconds 1800 \
            --parameters "file:///tmp/ssm-restore-params.json" \
            --query Command.CommandId --output text)
          echo "SSM CommandId=$CMD_ID instance=$ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$ID" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json | tee "/tmp/restore-$ID.json"
          STATUS=$(python3 -c "import json;print(json.load(open('/tmp/restore-$ID.json'))['Status'])")
          if [ "$STATUS" != "Success" ]; then
            echo "DB restore failed on $ID status=$STATUS" >&2
            exit 1
          fi
          echo "DB restore completed" >> "$GITHUB_STEP_SUMMARY"

      - name: Dump CodeDeploy failure details
        if: failure() && steps.deploy.outputs.deployment_id != ''
        run: |
          DEPLOY_ID="${{ steps.deploy.outputs.deployment_id }}"
          echo "### CodeDeploy failure details" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment ID: $DEPLOY_ID" >> "$GITHUB_STEP_SUMMARY"
          aws deploy get-deployment --deployment-id "$DEPLOY_ID" --output json | tee /tmp/deploy.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("/tmp/deploy.json"))
          info=d.get("deploymentInfo",{})
          print(json.dumps({
            "status": info.get("status"),
            "errorInformation": info.get("errorInformation"),
            "deploymentOverview": info.get("deploymentOverview"),
          }, indent=2, ensure_ascii=False))
          PY
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          TARGETS=$(aws deploy list-deployment-targets --deployment-id "$DEPLOY_ID" --query 'targetIds' --output text)
          for t in $TARGETS; do
            echo "---- target $t ----"
            aws deploy get-deployment-target --deployment-id "$DEPLOY_ID" --target-id "$t" --output json | tee "/tmp/target-$t.json"
            echo "#### Target \`$t\`" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python3 - <<PY >> "$GITHUB_STEP_SUMMARY"
          import json
          t=json.load(open("/tmp/target-$t.json"))
          di=t.get("deploymentTarget",{}).get("instanceTarget",{})
          print(json.dumps({
            "status": di.get("status"),
            "lifecycleEvents": [
              {"name": e.get("lifecycleEventName"), "status": e.get("status"),
               "diagnostics": (e.get("diagnostics") or {}).get("message")}
              for e in di.get("lifecycleEvents", [])
            ],
          }, indent=2, ensure_ascii=False))
          PY
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
