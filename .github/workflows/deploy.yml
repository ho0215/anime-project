name: Django CD Pipeline (CodeDeploy)

# Run workflow 버튼은 기본 브랜치(main)에 workflow_dispatch 가 있어야 보임.
# 머지 전 테스트용으로 feature 브랜치 push 에도 동작하게 함.
on:
  push:
    branches:
      - main
      - cursor/terraform-cicd-automation
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
  CODE_DEPLOY_APP_NAME: ${{ vars.CODE_DEPLOY_APP_NAME || 'aniverse-app' }}
  CODE_DEPLOY_GROUP_NAME: ${{ vars.CODE_DEPLOY_GROUP_NAME || 'aniverse-deployment-group' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package application
        run: |
          zip -r deploy.zip . \
            -x "*.git*" \
            -x "*venv*" \
            -x "*.cursor*" \
            -x "*__pycache__*" \
            -x "*.pyc" \
            -x "mydb_backup.sql" \
            -x "media/*" \
            -x "media (2)/*" \
            -x "staticfiles/*" \
            -x ".env"

      - name: Upload artifact to S3
        run: aws s3 cp deploy.zip "s3://${S3_BUCKET_NAME}/deploy.zip"

      - name: Create CodeDeploy deployment
        id: deploy
        run: |
          DEPLOY_ID=$(aws deploy create-deployment \
            --application-name "$CODE_DEPLOY_APP_NAME" \
            --deployment-config-name CodeDeployDefault.OneAtATime \
            --deployment-group-name "$CODE_DEPLOY_GROUP_NAME" \
            --s3-location "bucket=${S3_BUCKET_NAME},bundleType=zip,key=deploy.zip" \
            --query deploymentId \
            --output text)
          echo "deployment_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment ID: $DEPLOY_ID" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for deployment to succeed
        id: wait
        run: |
          aws deploy wait deployment-successful --deployment-id "${{ steps.deploy.outputs.deployment_id }}"
          echo "Deployment succeeded" >> "$GITHUB_STEP_SUMMARY"

      - name: Dump CodeDeploy failure details
        if: failure() && steps.deploy.outputs.deployment_id != ''
        run: |
          DEPLOY_ID="${{ steps.deploy.outputs.deployment_id }}"
          echo "### CodeDeploy failure details" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment ID: $DEPLOY_ID" >> "$GITHUB_STEP_SUMMARY"
          aws deploy get-deployment --deployment-id "$DEPLOY_ID" --output json | tee /tmp/deploy.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open("/tmp/deploy.json"))
          info=d.get("deploymentInfo",{})
          print(json.dumps({
            "status": info.get("status"),
            "errorInformation": info.get("errorInformation"),
            "deploymentOverview": info.get("deploymentOverview"),
          }, indent=2, ensure_ascii=False))
          PY
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          TARGETS=$(aws deploy list-deployment-targets --deployment-id "$DEPLOY_ID" --query 'targetIds' --output text)
          for t in $TARGETS; do
            echo "---- target $t ----"
            aws deploy get-deployment-target --deployment-id "$DEPLOY_ID" --target-id "$t" --output json | tee "/tmp/target-$t.json"
            echo "#### Target \`$t\`" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            python3 - <<PY >> "$GITHUB_STEP_SUMMARY"
          import json
          t=json.load(open("/tmp/target-$t.json"))
          di=t.get("deploymentTarget",{}).get("instanceTarget",{})
          print(json.dumps({
            "status": di.get("status"),
            "lifecycleEvents": [
              {"name": e.get("lifecycleEventName"), "status": e.get("status"),
               "diagnostics": (e.get("diagnostics") or {}).get("message")}
              for e in di.get("lifecycleEvents", [])
            ],
          }, indent=2, ensure_ascii=False))
          PY
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
