# Build container image; push to ECR on main (or manual run)
name: Docker build

on:
  push:
    branches: [main, cursor/**]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: aniverse
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: aniverse

jobs:
  build:
    runs-on: ubuntu-latest
    # main push / 수동 실행만 ECR push (PR·feature 브랜치는 빌드만)
    env:
      PUSH_ECR: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::12}"
          echo "sha_tag=sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "ref_tag=ref-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          echo "PUSH_ECR=${PUSH_ECR}"
          echo "Image tags: sha-${SHA_SHORT}, ref-${GITHUB_REF_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: env.PUSH_ECR == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: env.PUSH_ECR == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:local
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — show image
        run: docker images "${{ env.IMAGE_NAME }}"

      - name: Tag and push to ECR
        if: env.PUSH_ECR == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          set -euo pipefail
          REMOTE="${REGISTRY}/${ECR_REPOSITORY}"
          docker tag "${IMAGE_NAME}:${SHA_TAG}" "${REMOTE}:${SHA_TAG}"
          docker tag "${IMAGE_NAME}:${SHA_TAG}" "${REMOTE}:latest"
          docker push "${REMOTE}:${SHA_TAG}"
          docker push "${REMOTE}:latest"
          echo "Pushed ${REMOTE}:${SHA_TAG}"
          echo "Pushed ${REMOTE}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${REMOTE}:${SHA_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${REMOTE}:latest\`" >> "$GITHUB_STEP_SUMMARY"
