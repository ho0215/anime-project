# Build container image; push to ECR on main (OIDC preferred, Access Key fallback)
name: Docker build

on:
  push:
    branches: [main, cursor/**]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: aniverse
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: aniverse

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ECR 후 values image.tag  bump push
      id-token: write # OIDC
    # main push / 수동 실행만 ECR push (PR·feature 브랜치는 빌드만)
    env:
      PUSH_ECR: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'true' || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # image.tag bump commit push 용
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA::12}"
          echo "sha_tag=sha-${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "ref_tag=ref-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"
          echo "PUSH_ECR=${PUSH_ECR}"
          echo "Image tags: sha-${SHA_SHORT}, ref-${GITHUB_REF_NAME}"

      - name: Resolve AWS auth mode
        id: auth
        if: env.PUSH_ECR == 'true'
        run: |
          if [ -n "${{ vars.AWS_ROLE_ARN }}" ] && [ "${{ vars.AWS_USE_OIDC }}" = "true" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ECR push needs OIDC (AWS_ROLE_ARN + AWS_USE_OIDC=true) or AWS_ACCESS_KEY_ID secret"
            exit 1
          fi
          echo "Auth mode: $(grep mode= "$GITHUB_OUTPUT" | cut -d= -f2)"
          {
            echo "### AWS auth"
            if [ -n "${{ vars.AWS_ROLE_ARN }}" ] && [ "${{ vars.AWS_USE_OIDC }}" = "true" ]; then
              echo "- mode: **OIDC**"
              echo "- role: \`${{ vars.AWS_ROLE_ARN }}\`"
            else
              echo "- mode: **access keys** (OIDC: set Variables \`AWS_USE_OIDC=true\` + \`AWS_ROLE_ARN\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Debug GitHub OIDC token claims
        if: env.PUSH_ECR == 'true' && steps.auth.outputs.mode == 'oidc'
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const slim = {
              sub: payload.sub,
              aud: payload.aud,
              repository: payload.repository,
              repository_id: payload.repository_id,
              repository_owner: payload.repository_owner,
              repository_owner_id: payload.repository_owner_id,
              ref: payload.ref,
              job_workflow_ref: payload.job_workflow_ref,
            };
            console.log('OIDC claims:', JSON.stringify(slim, null, 2));
            await core.summary.addHeading('OIDC claims').addCodeBlock(JSON.stringify(slim, null, 2), 'json').write();

      - name: Configure AWS credentials (OIDC)
        if: env.PUSH_ECR == 'true' && steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (Access Key)
        if: env.PUSH_ECR == 'true' && steps.auth.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        if: env.PUSH_ECR == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:local
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — show image
        run: docker images "${{ env.IMAGE_NAME }}"

      - name: Tag and push to ECR
        if: env.PUSH_ECR == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          set -euo pipefail
          REMOTE="${REGISTRY}/${ECR_REPOSITORY}"
          docker tag "${IMAGE_NAME}:${SHA_TAG}" "${REMOTE}:${SHA_TAG}"
          docker tag "${IMAGE_NAME}:${SHA_TAG}" "${REMOTE}:latest"
          docker push "${REMOTE}:${SHA_TAG}"
          docker push "${REMOTE}:latest"
          echo "Pushed ${REMOTE}:${SHA_TAG}"
          {
            echo "### ECR push"
            echo "- \`${REMOTE}:${SHA_TAG}\`"
            echo "- \`${REMOTE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Argo GitOps: values 의 image.tag 를 sha-* 로 올려 sync 유도. [skip ci] 로 재빌드 루프 방지.
      - name: Bump Helm image.tag (GitOps)
        if: env.PUSH_ECR == 'true'
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          set -euo pipefail
          FILES=(
            deploy/helm/aniverse/values-eks.yaml
            deploy/helm/aniverse/values-lab-ecr.yaml
          )
          for f in "${FILES[@]}"; do
            test -f "$f"
            sed -i -E "s/^([[:space:]]*tag:)[[:space:]].*/\\1 ${SHA_TAG}/" "$f"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          if git diff --staged --quiet; then
            echo "image.tag already ${SHA_TAG}"
            exit 0
          fi
          git commit -m "chore(helm): bump image.tag to ${SHA_TAG} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          {
            echo "### GitOps tag bump"
            echo "- \`image.tag\` → \`${SHA_TAG}\` (values-eks / values-lab-ecr)"
            echo "- commit includes \`[skip ci]\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # image.tag bump 직후 Argo apply sync — Git만 올라가고 Deployment 가 안 따라가 OutOfSync 되는 것 방지
      - name: Sync Argo CD Application (EKS)
        if: env.PUSH_ECR == 'true'
        continue-on-error: true
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'aniverse-eks' }}
          ARGO_APP: aniverse-eks
          ARGO_NS: argocd
        run: |
          set -euo pipefail
          if ! command -v kubectl >/dev/null; then
            curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
          if ! aws eks update-kubeconfig --region "${AWS_REGION}" --name "${EKS_CLUSTER_NAME}" 2>/tmp/eks-kube.err; then
            echo "::warning::EKS kubeconfig 실패 — ECR/OIDC 역할에 클러스터 권한이 없을 수 있음. Argo UI Sync 또는 infra 역할 사용."
            cat /tmp/eks-kube.err || true
            exit 0
          fi
          if ! kubectl -n "${ARGO_NS}" get app "${ARGO_APP}" >/dev/null 2>&1; then
            echo "::warning::Application ${ARGO_APP} 없음 — skip Argo sync"
            exit 0
          fi
          # SSA 잔존 제거 (ComparisonError 방지)
          kubectl -n "${ARGO_NS}" patch application "${ARGO_APP}" --type=json -p='[
            {"op":"replace","path":"/spec/syncPolicy/syncOptions","value":["CreateNamespace=true","RespectIgnoreDifferences=true"]}
          ]' 2>/dev/null || true
          kubectl -n "${ARGO_NS}" patch application "${ARGO_APP}" --type=json \
            -p='[{"op":"remove","path":"/operation"}]' 2>/dev/null || true
          kubectl -n "${ARGO_NS}" annotate application "${ARGO_APP}" \
            argocd.argoproj.io/refresh=hard --overwrite
          kubectl -n "${ARGO_NS}" patch application "${ARGO_APP}" --type merge -p \
            "{\"operation\":{\"initiatedBy\":{\"username\":\"docker-build\"},\"sync\":{\"revision\":\"HEAD\",\"syncStrategy\":{\"apply\":{\"force\":false}},\"syncOptions\":[\"CreateNamespace=true\",\"RespectIgnoreDifferences=true\"]}}}" \
            || true
          for i in $(seq 1 24); do
            SYNC_ST=$(kubectl -n "${ARGO_NS}" get app "${ARGO_APP}" -o jsonpath='{.status.sync.status}' 2>/dev/null || true)
            HEALTH=$(kubectl -n "${ARGO_NS}" get app "${ARGO_APP}" -o jsonpath='{.status.health.status}' 2>/dev/null || true)
            WEB=$(kubectl -n "${ARGO_NS}" get app "${ARGO_APP}" \
              -o jsonpath='{range .status.resources[?(@.kind=="Deployment")]}{.name}={.status}{"\n"}{end}' 2>/dev/null || true)
            echo "  [$i] sync=${SYNC_ST} health=${HEALTH} deploy=${WEB}"
            if [ "${SYNC_ST}" = "Synced" ]; then
              echo "Argo Synced after image.tag bump"
              echo "- Argo sync: **Synced** (\`${SHA_TAG:-bump}\`)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Argo still ${SYNC_ST:-unknown} after bump — selfHeal 이 이어가거나 수동 Sync"
          kubectl -n "${ARGO_NS}" get app "${ARGO_APP}" -o wide || true
          echo "- Argo sync: **${SYNC_ST:-timeout}** (selfHeal/수동 Sync)" >> "$GITHUB_STEP_SUMMARY"
