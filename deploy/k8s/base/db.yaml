apiVersion: v1
kind: Service
metadata:
  name: aniverse-db
  labels:
    app: aniverse-db
spec:
  clusterIP: None
  selector:
    app: aniverse-db
  ports:
    - port: 3306
      targetPort: 3306
---
# local-path StorageClass(rancher local-path-provisioner)로 PVC 사용.
# EKS에서는 storageClassName만 EBS CSI 기반 StorageClass로 바꾸면 된다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: aniverse-db
  labels:
    app: aniverse-db
spec:
  serviceName: aniverse-db
  replicas: 1
  selector:
    matchLabels:
      app: aniverse-db
  template:
    metadata:
      labels:
        app: aniverse-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: aniverse-app-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: aniverse-app-config
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aniverse-app-secrets
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aniverse-app-secrets
                  key: DB_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
