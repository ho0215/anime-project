# Placeholder manifests — local minikube / later EKS
# Apply: kubectl apply -k deploy/k8s/overlays/local
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aniverse-web
  labels:
    app: aniverse-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aniverse-web
  template:
    metadata:
      labels:
        app: aniverse-web
    spec:
      containers:
        - name: web
          image: aniverse:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: aniverse-app-secrets
            - configMapRef:
                name: aniverse-app-config
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 50
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aniverse-web
spec:
  selector:
    app: aniverse-web
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
