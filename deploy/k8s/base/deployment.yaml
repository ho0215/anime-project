# Placeholder manifests — local minikube / later EKS
# Apply: kubectl apply -k deploy/k8s/overlays/local
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aniverse-web
  labels:
    app: aniverse-web
spec:
  # replicas는 일부러 안 둔다 — HPA(hpa.yaml)가 이 필드를 관리하는데, 여기 고정값을
  # 넣어두면 kubectl apply 할 때마다 HPA가 정한 replicas를 도로 덮어써서 계속
  # 싸운다 (실제로 재현: apply 한 번에 1로 리셋되는 것 확인함).
  selector:
    matchLabels:
      app: aniverse-web
  template:
    metadata:
      labels:
        app: aniverse-web
    spec:
      containers:
        - name: web
          image: aniverse:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: aniverse-app-secrets
            - configMapRef:
                name: aniverse-app-config
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 50
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: aniverse-web
spec:
  selector:
    app: aniverse-web
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
