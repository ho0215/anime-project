# 학습용: DB는 aniverse-web 파드한테서만 3306 접속을 받는다.
# 기본값은 "클러스터 내 아무 네임스페이스에서나 접근 가능"이라 이 정책 없이는
# 다른 네임스페이스 파드가 DB에 바로 붙을 수 있다 (직접 재현/검증함).
# VPC CNI 고유 동작(ENI 매핑 등)과 달리 이건 EKS에서도 그대로 재사용 가능
# (EKS도 Calico든 VPC CNI의 NetworkPolicy 지원이든 이 스펙을 그대로 따름).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aniverse-db-allow-web-only
spec:
  podSelector:
    matchLabels:
      app: aniverse-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: aniverse-web
      ports:
        - protocol: TCP
          port: 3306
