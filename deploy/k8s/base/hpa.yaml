# 학습용: 파드 레벨 오토스케일링(HPA).
# maxReplicas는 2로 제한한다 — aniverse-quota의 limits.cpu 하드캡(3)을 보면
# web(1 CPU) * 3 + db(500m) = 3.5 > 3 이라 3개째부터는 quota가 거부한다.
# HPA의 maxReplicas가 namespace quota보다 크면 HPA는 절대 자기 목표치까지
# 못 올라가고 "Desired 4 / Running 2"처럼 어긋난 채로 멈춘다 (실제로 재현 확인함).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aniverse-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aniverse-web
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
