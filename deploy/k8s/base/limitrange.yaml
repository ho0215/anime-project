# resources를 명시하지 않은 컨테이너에 기본 request/limit을 주입하고,
# 너무 큰 값은 애초에 막는다 (ResourceQuota는 스케줄만 안 되게 할 뿐,
# 개별 컨테이너 값 자체를 강제하지는 않음).
apiVersion: v1
kind: LimitRange
metadata:
  name: aniverse-limits
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 512Mi
