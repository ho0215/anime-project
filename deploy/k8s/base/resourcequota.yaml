# 학습용: aniverse 네임스페이스 자원 가드레일.
# 랩 클러스터 워커 노드가 2 vCPU / ~3.9Gi 라, 네임스페이스 하나가
# 노드를 통째로 잡아먹지 않도록 총량을 제한한다.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aniverse-quota
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
    # limits는 정상 운영치(web 1 CPU/1Gi + db 500m/512Mi = 1.5)보다 여유를 둔다:
    # 롤링 업데이트 중엔 신규 파드가 뜨는 동안 구/신 파드가 잠깐 동시에 떠서
    # limits가 일시적으로 두 배 가까이 필요해진다 (너무 타이트하면 배포 자체가 막힘).
    limits.cpu: "3"                
    limits.memory: 3Gi
---
# resources를 명시하지 않은 컨테이너에 기본 request/limit을 주입하고,
# 너무 크거나 작은 값은 애초에 막는다 (ResourceQuota는 스케줄만 안 되게 할 뿐,
# 값 자체를 강제하지는 않음).
apiVersion: v1
kind: LimitRange
metadata:
  name: aniverse-limits
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      min:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
