apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aniverse
resources:
  - config.yaml
  - db.yaml
  - deployment.yaml
  - resourcequota.yaml
  - limitrange.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml
commonLabels:
  project: aniverse
labels:
  - pairs:
      project: aniverse
    includeSelectors: false
    includeTemplates: true
