apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aniverse
resources:
  - ../../base
  - namespace.yaml
images:
  # 태그 변경 예:
  #   kustomize edit set image aniverse=841535407395.dkr.ecr.ap-northeast-2.amazonaws.com/aniverse:sha-xxxxxxxxxxxx
  - name: aniverse
    newName: 841535407395.dkr.ecr.ap-northeast-2.amazonaws.com/aniverse
    newTag: latest
patches:
  - path: web-image-pull-policy.yaml
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: aniverse-db
    path: db-emptydir.json
