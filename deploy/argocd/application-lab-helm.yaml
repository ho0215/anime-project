# 계획: Actions → ECR → Argo → (윤주 Helm 차트)
# 랩 클러스터용 Application — path = deploy/helm/aniverse
#
# 적용:
#   kubectl apply -f deploy/argocd/application-lab-helm.yaml
# 기존 Kustomize Application(aniverse-lab)과 이름 동일 → Helm으로 전환됨
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aniverse-lab
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    description: "Aniverse lab via Helm (deploy/helm/aniverse + values-lab-ecr)"
spec:
  project: default
  source:
    repoURL: https://github.com/ho0215/anime-project.git
    targetRevision: main
    path: deploy/helm/aniverse
    helm:
      releaseName: aniverse
      valueFiles:
        - values-lab-ecr.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: aniverse
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences: []
