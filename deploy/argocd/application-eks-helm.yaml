# EKS용 Argo Application — 클러스터에 Argo 설치 후 sync
# values: deploy/helm/aniverse/values-eks.yaml
#
#   ./scripts/argocd-eks-install.sh
#   # 또는
#   kubectl apply -f deploy/argocd/application-eks-helm.yaml
#
# Secret: values-eks 의 secrets.* 는 비움(required). 설치 스크립트가
# 이미 떠 있는 aniverse-app-secrets 를 Helm parameter 로 주입한다.
# Git 랩 기본 비밀번호로 덮지 않음. ignoreDifferences 로 live data 보존.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aniverse-eks
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    description: "Aniverse EKS via Helm (Actions → ECR → Argo → EKS)"
spec:
  project: default
  source:
    repoURL: https://github.com/ho0215/anime-project.git
    targetRevision: main
    path: deploy/helm/aniverse
    helm:
      releaseName: aniverse
      valueFiles:
        - values-eks.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: aniverse
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      # 금지: ServerSideApply=true
      # → live Deployment/STS 의 .status.terminatingReplicas 와 Argo 정적 스키마가
      #   어긋나 ComparisonError → sync=Unknown / health=Missing (Job 미생성) 고착.
      # kubectl apply 가 이전 값(ServerSideApply)을 남길 수 있으므로
      # scripts/argocd-eks-install.sh 가 syncOptions 를 JSON replace 로 강제한다.
  ignoreDifferences:
    # HPA 가 replicas 를 관리
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.replicas
        # K8s 신규 status 필드 — Argo 정적 스키마에 없으면 ComparisonError
        - .status.terminatingReplicas
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .status.terminatingReplicas
    # 비밀번호는 클러스터 Secret / Helm parameter 우선
    - group: ""
      kind: Secret
      name: aniverse-app-secrets
      jsonPointers:
        - /data
        - /stringData
