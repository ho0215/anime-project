# EKS용 Argo Application — 클러스터에 Argo 설치 후 sync
# values: deploy/helm/aniverse/values-eks.yaml
#
#   ./scripts/argocd-eks-install.sh
#   # 또는
#   kubectl apply -f deploy/argocd/application-eks-helm.yaml
#
# Secret: values-eks 의 externalSecrets.enabled: true — External Secrets
# Operator가 AWS Secrets Manager(aniverse/app-secrets)에서 aniverse-app-secrets
# Secret을 직접 만든다(docs/external-secrets.md, anime-project-infra). Helm은
# 이 Secret을 렌더링하지 않으므로 Argo가 비교할 desired 리소스가 없다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aniverse-eks
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    description: "Aniverse EKS via Helm (Actions → ECR → Argo → EKS)"
spec:
  project: default
  source:
    repoURL: https://github.com/ho0215/anime-project.git
    targetRevision: main
    path: deploy/helm/aniverse
    helm:
      releaseName: aniverse
      valueFiles:
        - values-eks.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: aniverse
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      # 금지: ServerSideApply=true
      # → live Deployment/STS 의 .status.terminatingReplicas 와 Argo 정적 스키마가
      #   어긋나 ComparisonError → sync=Unknown / health=Missing (Job 미생성) 고착.
      # kubectl apply 가 이전 값(ServerSideApply)을 남길 수 있으므로
      # scripts/argocd-eks-install.sh 가 syncOptions 를 JSON replace 로 강제한다.
  ignoreDifferences:
    # HPA 가 replicas 를 관리
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.replicas
        # K8s 신규 status 필드 — Argo 정적 스키마에 없으면 ComparisonError
        - .status.terminatingReplicas
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .status.terminatingReplicas
