# EKS 오버라이드 — secrets 는 git 에 두지 않음.
# External Secrets Operator가 AWS Secrets Manager(aniverse/app-secrets)에서
# 동기화 (docs/external-secrets.md). infra 쪽 IRSA/시크릿 생성은 modules/eks
# enable_external_secrets + environments/dev/secrets.tf.

image:
  # CI(docker-build)가 ECR push 후 sha-* 로 자동 갱신
  repository: 841535407395.dkr.ecr.ap-northeast-2.amazonaws.com/aniverse
  tag: sha-af4dc9afbf58
  pullPolicy: Always

externalSecrets:
  enabled: true
  secretName: "aniverse/app-secrets"
  region: ap-northeast-2
  serviceAccountName: external-secrets
  namespace: external-secrets

# minReplicas=2 — topologySpreadConstraints(web-deployment.yaml)로 AZ 분산이
# 실제 효과를 가지려면 항상 최소 2개는 떠 있어야 함(1개면 나눌 게 없음).
# maxReplicas=4 — min=max=2였으면 HPA가 스케일업할 여지가 아예 없었음
# (2026-10-01 부하테스트로 발견: CPU가 target 50%를 10배 넘겨도 못 늘어남).
# 노드(t3.medium) request는 파드당 100m/256Mi라 4개는 스케줄링에 전혀
# 부담 없음 — resourceQuota.limitsCpu/limitsMemory만 같이 올리면 됨
# (web 1cpu*4 + db 500m = 4.5).
autoscaling:
  minReplicas: 2
  maxReplicas: 4

resourceQuota:
  limitsCpu: "5"
  limitsMemory: 5Gi

# infra: module.eks app S3 IRSA (role name aniverse-web-s3-irsa)
serviceAccount:
  create: true
  name: aniverse-web
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::841535407395:role/aniverse-web-s3-irsa"

config:
  DJANGO_DEBUG: "False"
  # 쉼표는 values 파일에만 넣는다 (--set-string 은 Helm이 쉼표로 키를 쪼갬)
  DJANGO_ALLOWED_HOSTS: "aniverse.my,www.aniverse.my,*"
  DJANGO_CSRF_TRUSTED_ORIGINS: "https://aniverse.my,https://www.aniverse.my,http://aniverse.my,http://www.aniverse.my"
  USE_HTTPS: "True"
  DB_NAME: aniverse
  DB_USER: aniverse
  DB_HOST: aniverse-db
  DB_PORT: "3306"
  AWS_S3_REGION_NAME: ap-northeast-2
  # Terraform output static_bucket_name — 설정 시 {% static %} → S3
  AWS_STORAGE_BUCKET_NAME: "aniverse-static-841535407395-ap-northeast-2"
  RUN_MIGRATE: "true"
  # 대량 collectstatic 은 CI/노트북 권장. media put 은 Pod IRSA.
  RUN_COLLECTSTATIC: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo.monitoring.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "aniverse-web"
  # ElastiCache — infra module.cache, Django Channels(웹소켓) 채널 레이어용.
  # 없으면 settings.py가 조용히 no-op 채널 레이어로 폴백(REDIS_URL 빈 값).
  REDIS_URL: "redis://aniverse-redis.5pbnwy.0001.apn2.cache.amazonaws.com:6379/0"

# destroy 후 빈 PVC 면 SQL 자동 복구 (Job → Git raw dump)
dbRestore:
  enabled: true
  minTables: 20
  sqlUrl: https://raw.githubusercontent.com/ho0215/anime-project/main/data/aniverse_backup.sql

persistence:
  enabled: true
  # EBS CSI StorageClass (infra module.eks kubernetes_storage_class.gp3)
  storageClassName: "gp3"
  size: 10Gi
  accessModes:
    - ReadWriteOnce

# Ingress → AWS Load Balancer Controller ALB
# aniverse.my 로 붙이려면 DNS(Route53/가비아)가 이 Ingress ALB 를 가리켜야 함.
#   ACM_CERT_ARN=... ./scripts/eks-bind-domain.sh
ingress:
  className: alb
  host: aniverse.my
  # Terraform output -raw waf_web_acl_arn (apply 2026-10-01)
  wafAclArn: "arn:aws:wafv2:ap-northeast-2:841535407395:regional/webacl/aniverse-alb-waf/536cd3c3-04ce-42fd-ac5b-1aa715a4b87b"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health/
    # Terraform output certificate_arn (account 841535407395)
    # 주의: ACM Status 가 ISSUED 일 때만 ALB 가 ADDRESS 를 줌.
    # PENDING_VALIDATION 이면 ssl-redirect/certificate-arn 때문에 ALB 미생성 → CI "ALB hostname missing".
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:ap-northeast-2:841535407395:certificate/da27663b-d716-4eaa-98ba-2ea5653bdb71"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"


# ──────────────────────────────────────────
# 백업 설정
# ──────────────────────────────────────────
backup:
  enabled: true
  schedule: "0 2 * * *"
  irsaRoleArn: "arn:aws:iam::841535407395:role/aniverse-db-backup-irsa"
  s3Bucket: "aniverse-static-841535407395-ap-northeast-2"
  s3Prefix: "db-backups"