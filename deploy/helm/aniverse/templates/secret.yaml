{{- /* externalSecrets.enabled(EKS)면 ExternalSecret(templates/external-secret.yaml)이
   같은 이름의 Secret을 대신 만든다 — 여기서 렌더링 안 함(둘이 같은 오브젝트를
   두고 충돌하는 걸 방지). 랩/로컬은 그대로 Helm이 값을 직접 넣는다. */ -}}
{{- if not .Values.externalSecrets.enabled }}
{{- $sk := required "secrets.DJANGO_SECRET_KEY required (Argo helm.parameters or --set-string)" .Values.secrets.DJANGO_SECRET_KEY -}}
{{- $db := required "secrets.DB_PASSWORD required (Argo helm.parameters or --set-string)" .Values.secrets.DB_PASSWORD -}}
{{- $root := required "secrets.DB_ROOT_PASSWORD required (Argo helm.parameters or --set-string)" .Values.secrets.DB_ROOT_PASSWORD -}}
apiVersion: v1
kind: Secret
metadata:
  name: aniverse-app-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aniverse.labels" . | nindent 4 }}
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ $sk | quote }}
  DB_PASSWORD: {{ $db | quote }}
  DB_ROOT_PASSWORD: {{ $root | quote }}
{{- end }}
