{{- if .Values.autoscaling.enabled }}
# maxReplicas는 resourceQuota.limitsCpu 하드캡을 넘지 않게 맞출 것.
# HPA의 maxReplicas가 namespace quota보다 크면 HPA는 절대 목표치까지 못 올라가고
# "Desired N / Running M"처럼 어긋난 채로 멈춘다 (deploy/k8s/base/hpa.yaml에서 재현 확인됨).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aniverse-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aniverse.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aniverse-web
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
