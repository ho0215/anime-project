apiVersion: apps/v1
kind: Deployment
metadata:
  name: aniverse-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aniverse.labels" . | nindent 4 }}
    app: aniverse-web
spec:
  # autoscaling.enabled=true면 replicas를 일부러 안 둔다 — HPA(hpa.yaml)가 이 필드를
  # 관리하는데, 여기 고정값을 넣으면 apply할 때마다 HPA가 정한 replicas를 도로
  # 덮어써서 계속 싸운다 (deploy/k8s/base/deployment.yaml에서 재현 확인됨).
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: aniverse-web
  template:
    metadata:
      labels:
        app: aniverse-web
    spec:
      {{- if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: aniverse-app-secrets
            - configMapRef:
                name: aniverse-app-config
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: {{ .Values.web.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: {{ .Values.web.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
