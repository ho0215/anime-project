apiVersion: apps/v1
kind: Deployment
metadata:
  name: aniverse-web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aniverse.labels" . | nindent 4 }}
    app: aniverse-web
spec:
  # autoscaling.enabled=true면 replicas를 일부러 안 둔다 — HPA(hpa.yaml)가 이 필드를
  # 관리하는데, 여기 고정값을 넣으면 apply할 때마다 HPA가 정한 replicas를 도로
  # 덮어써서 계속 싸운다 (deploy/k8s/base/deployment.yaml에서 재현 확인됨).
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app: aniverse-web
  template:
    metadata:
      labels:
        app: aniverse-web
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      # 안티 어피니티 — aniverse-web 파드끼리 서로 다른 노드에 분산 배치
      # preferred(선호)방식이라 노드가 부족해도 스케줄링 실패 없이 최대한 분산함
      # topologyKey: kubernetes.io/hostname → 노드 단위로 분산
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - aniverse-web
                topologyKey: kubernetes.io/hostname
      # 위 안티 어피니티는 "같은 노드만" 피하고 AZ는 안 봄 — 노드 2개가 같은 AZ에
      # 있어도 통과됨. topology.kubernetes.io/zone 기준으로 AZ 자체를 분산시켜서
      # 가용영역 하나가 죽어도 나머지 AZ의 replica가 계속 서빙하게 함.
      # ScheduleAnyway(선호) — AZ가 1개뿐인 상황(노드 축소 등)에서도 Pending 안 남.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: aniverse-web
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: aniverse-app-secrets
            - configMapRef:
                name: aniverse-app-config
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: aniverse.my
            initialDelaySeconds: {{ .Values.web.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: aniverse.my
            initialDelaySeconds: {{ .Values.web.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.liveness.periodSeconds }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}