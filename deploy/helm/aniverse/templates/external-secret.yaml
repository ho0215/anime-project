{{- /* EKS 전용(values-eks.yaml externalSecrets.enabled=true). AWS Secrets Manager의
   시크릿 1개를 여기서 정의한 이름 그대로 aniverse-app-secrets Secret으로 동기화한다.
   ClusterSecretStore 는 클러스터에 1개면 충분 — release 여러 개를 걱정할 상황이
   아니라서 네임스페이스별 SecretStore 대신 이 방식으로 단순화. */ -}}
{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aniverse-secretstore
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccountName }}
            namespace: {{ .Values.externalSecrets.namespace }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aniverse-app-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aniverse.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aniverse-secretstore
    kind: ClusterSecretStore
  target:
    name: aniverse-app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.externalSecrets.secretName }}
{{- end }}
