{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aniverse-db-backup
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.backup.irsaRoleArn }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aniverse-db-backup
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aniverse-db-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aniverse-db-backup
subjects:
  - kind: ServiceAccount
    name: aniverse-db-backup
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aniverse-db-backup
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: aniverse-db-backup
          restartPolicy: OnFailure
          containers:
            - name: db-backup
              # kubectl 미리 설치된 전용 이미지 (deploy/docker/db-backup-tools/Dockerfile) —
              # 매 실행마다 yum install로 설치하던 것이 OOM/hang 원인이었음(2026-10-13, 10-16).
              # 메인 앱(aniverse)과 변경 빈도가 달라 별도 ECR 레포로 분리(2026-10-16) —
              # 같은 레포 태그로 두면 메인 앱이 쌓이면서 라이프사이클 정책에 밀려 삭제될 위험이 있었음.
              image: 841535407395.dkr.ecr.ap-northeast-2.amazonaws.com/aniverse-db-backup-tools:latest
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              env:
                - name: S3_BUCKET
                  value: {{ .Values.backup.s3Bucket | quote }}
                - name: S3_PREFIX
                  value: {{ .Values.backup.s3Prefix | quote }}
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: aniverse-app-secrets
                      key: DB_ROOT_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  DATE=$(date +%Y%m%d-%H%M%S)
                  echo "백업 시작: ${DATE}"
                  kubectl exec -n aniverse aniverse-db-0 -- mariadb-dump -uroot -p${MYSQL_PWD} aniverse > /tmp/backup-${DATE}.sql
                  echo "백업 파일 크기: $(ls -lh /tmp/backup-${DATE}.sql)"
                  aws s3 cp /tmp/backup-${DATE}.sql s3://${S3_BUCKET}/${S3_PREFIX}/backup-${DATE}.sql
                  echo "백업 완료: s3://${S3_BUCKET}/${S3_PREFIX}/backup-${DATE}.sql"
{{- end }}
