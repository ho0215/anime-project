{{- if .Values.serviceAccount.create }}
# EKS에서 파드 단위 IAM(IRSA)용. annotations에 eks.amazonaws.com/role-arn을 넣으면
# 이 ServiceAccount를 쓰는 파드가 그 IAM role을 그대로 assume한다
# (anime-project-infra modules/eks의 aws_iam_role.app_s3, output app_s3_irsa_role_arn).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aniverse.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
