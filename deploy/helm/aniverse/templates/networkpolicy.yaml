{{- if .Values.networkPolicy.enabled }}
# 학습용: DB는 aniverse-web 파드한테서만 3306 접속을 받는다. 기본값은 "클러스터 내
# 아무 네임스페이스에서나 접근 가능"이라 이 정책 없이는 다른 네임스페이스 파드가
# DB에 바로 붙을 수 있다.
# EKS에서 강제되려면 VPC CNI addon의 enableNetworkPolicy가 켜져 있어야 한다
# (anime-project-infra modules/eks/main.tf aws_eks_addon.vpc_cni 참고).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aniverse-db-allow-web-only
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aniverse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: aniverse-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: aniverse-web
        - podSelector:
            matchLabels:
              app: aniverse-db-restore
      ports:
        - protocol: TCP
          port: {{ .Values.db.port }}
{{- end }}
