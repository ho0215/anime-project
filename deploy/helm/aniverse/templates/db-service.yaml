apiVersion: v1
kind: Service
metadata:
  name: aniverse-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "aniverse.labels" . | nindent 4 }}
    app: aniverse-db
spec:
  clusterIP: None
  selector:
    app: aniverse-db
  ports:
    - port: {{ .Values.db.port }}
      targetPort: {{ .Values.db.port }}
