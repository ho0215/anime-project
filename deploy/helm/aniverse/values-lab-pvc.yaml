# PVC 검증용 오버레이. 랩 클러스터엔 아직 StorageClass 가 없어서(get sc 빈 결과),
# 1차 검증은 minikube 로 한다 (docs/local-k8s.md) — minikube 는 기본 StorageClass
# `standard` 를 자동으로 갖고 있어서 storageClassName 을 비워도 바로 PVC 가 생성된다.
# 랩/EKS 에 실제 StorageClass 가 생기면 그 이름으로 교체해서 재검증할 것.
#
# 검증 전용. Argo(application-lab-helm.yaml)는 아직 이 파일을 참조하지 않음.
#
# 사용 (minikube, base values.yaml 의 image: aniverse:local 그대로 사용):
#   eval $(minikube docker-env) && docker build -t aniverse:local .
#   helm upgrade --install aniverse-pvc-test deploy/helm/aniverse \
#     -n aniverse-pvc-test --create-namespace \
#     -f deploy/helm/aniverse/values-lab-pvc.yaml
#
# 정리:
#   helm uninstall aniverse-pvc-test -n aniverse-pvc-test
#   kubectl delete ns aniverse-pvc-test

persistence:
  enabled: true
  # 비워두면 클러스터 기본 StorageClass 사용 (minikube = standard).
  # 랩 클러스터/EKS 실제 이름이 정해지면 여기 채우고 재검증.
  storageClassName: ""
  size: 2Gi
  accessModes:
    - ReadWriteOnce
