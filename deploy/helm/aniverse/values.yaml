# 기본값 = 랩/로컬 클러스터 기준 (deploy/k8s/overlays/local 과 동일 동작).
# EKS 등 다른 환경은 별도 values-*.yaml 로 오버라이드해서 사용한다.
# 예: helm install aniverse . -n aniverse --create-namespace -f values-eks.yaml

image:
  repository: aniverse
  tag: local
  pullPolicy: IfNotPresent

web:
  replicas: 1
  service:
    port: 80
    targetPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  probes:
    readiness:
      initialDelaySeconds: 20
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 50
      periodSeconds: 20

db:
  image: mariadb:11.4
  port: 3306

# aniverse-app-config ConfigMap 으로 그대로 들어간다 (config/settings.py 가 읽는 키들).
config:
  DJANGO_DEBUG: "True"
  DJANGO_ALLOWED_HOSTS: "*"
  DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:8000"
  USE_HTTPS: "False"
  DB_NAME: aniverse
  DB_USER: aniverse
  DB_HOST: aniverse-db
  DB_PORT: "3306"
  AWS_S3_REGION_NAME: ap-northeast-2
  # AWS_STORAGE_BUCKET_NAME: ""  # 설정 시 static+media S3 (docs/static-s3.md)
  RUN_MIGRATE: "true"
  RUN_COLLECTSTATIC: "false"

# aniverse-app-secrets Secret 으로 그대로 들어간다.
# ⚠️ 랩/로컬 기본값. 운영/EKS(values-eks) 는 비워 두고
# Argo helm.parameters / `--set-string secrets.*=...` 로만 주입한다.
secrets:
  DJANGO_SECRET_KEY: "local-k8s-dev-change-me"
  DB_PASSWORD: "aniversepass"
  DB_ROOT_PASSWORD: "rootpass"

# web Pod SA (EKS IRSA: values-eks annotations)
serviceAccount:
  create: true
  name: aniverse-web
  annotations: {}

# destroy → 재apply 후 빈 DB 에 SQL 덤프 자동 적재 (Job).
# 테이블 수가 minTables 이상이면 skip. 덤프는 ConfigMap이 아니라 sqlUrl 에서 fetch.
dbRestore:
  enabled: false
  minTables: 20
  sqlUrl: https://raw.githubusercontent.com/ho0215/anime-project/main/data/aniverse_backup.sql

# DB 볼륨 설정.
# enabled: false (기본, 랩용) → StatefulSet 이 emptyDir 사용 (Pod 삭제 시 데이터 소실).
# enabled: true  (EKS 등)     → volumeClaimTemplates 로 PVC 생성 (storageClassName 필수 확인).
persistence:
  enabled: false
  storageClassName: "" # 비우면 클러스터 기본 StorageClass 사용. EKS는 EBS CSI StorageClass 이름 지정.
  size: 5Gi
  accessModes:
    - ReadWriteOnce

# 파드 레벨 오토스케일링(HPA). maxReplicas는 resourceQuota.limitsCpu 하드캡 아래로 유지할 것
# (web 1cpu * maxReplicas + db 500m 이 limits.cpu를 넘으면 안 됨).
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 50

# aniverse 네임스페이스 자원 가드레일 (ResourceQuota + LimitRange).
resourceQuota:
  enabled: true
  pods: "10"
  requestsCpu: "1"
  requestsMemory: 1Gi
  limitsCpu: "3"
  limitsMemory: 3Gi
  limitRange:
    defaultCpu: 500m
    defaultMemory: 512Mi
    defaultRequestCpu: 100m
    defaultRequestMemory: 128Mi
    minCpu: 50m
    minMemory: 64Mi
    maxCpu: "1"
    maxMemory: 1Gi

# DB는 web 파드에서만 3306 접근 허용.
networkPolicy:
  enabled: true

# 외부 트래픽 진입점. 기본값 = 랩(nginx ingress-controller) 기준.
# EKS는 values-eks.yaml에서 className: alb 등으로 오버라이드.
ingress:
  enabled: true
  className: nginx
  host: aniverse.lab.local
  annotations: {}
  tls:
    enabled: false
    secretName: ""
