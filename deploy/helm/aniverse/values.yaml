# 기본값 = 랩/로컬 클러스터 기준 (deploy/k8s/overlays/local 과 동일 동작).
# EKS 등 다른 환경은 별도 values-*.yaml 로 오버라이드해서 사용한다.
# 예: helm install aniverse . -n aniverse --create-namespace -f values-eks.yaml

image:
  repository: aniverse
  tag: local
  pullPolicy: IfNotPresent

web:
  replicas: 1
  service:
    port: 80
    targetPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  probes:
    readiness:
      initialDelaySeconds: 20
      periodSeconds: 10
    liveness:
      initialDelaySeconds: 50
      periodSeconds: 20

db:
  image: mariadb:11.4
  port: 3306

# aniverse-app-config ConfigMap 으로 그대로 들어간다 (config/settings.py 가 읽는 키들).
config:
  DJANGO_DEBUG: "True"
  DJANGO_ALLOWED_HOSTS: "*"
  DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1,http://localhost:8000"
  USE_HTTPS: "False"
  DB_NAME: aniverse
  DB_USER: aniverse
  DB_HOST: aniverse-db
  DB_PORT: "3306"
  AWS_S3_REGION_NAME: ap-northeast-2
  RUN_MIGRATE: "true"
  RUN_COLLECTSTATIC: "false"

# aniverse-app-secrets Secret 으로 그대로 들어간다.
# ⚠️ 랩/로컬 기본값. 운영/EKS 에서는 절대 이 값 그대로 쓰지 말고
# `--set-string secrets.DB_PASSWORD=...` 등으로 CI/CD 에서 주입할 것.
secrets:
  DJANGO_SECRET_KEY: "local-k8s-dev-change-me"
  DB_PASSWORD: "aniversepass"
  DB_ROOT_PASSWORD: "rootpass"

# DB 볼륨 설정.
# enabled: false (기본, 랩용) → StatefulSet 이 emptyDir 사용 (Pod 삭제 시 데이터 소실).
# enabled: true  (EKS 등)     → volumeClaimTemplates 로 PVC 생성 (storageClassName 필수 확인).
persistence:
  enabled: false
  storageClassName: "" # 비우면 클러스터 기본 StorageClass 사용. EKS는 EBS CSI StorageClass 이름 지정.
  size: 5Gi
  accessModes:
    - ReadWriteOnce
