version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/aniverse

hooks:
  AfterInstall:
    # 👇 의존성 설치 스크립트 지정
    - location: scripts/install_dependencies.sh
      timeout: 300
      runas: root

  ApplicationStart:
    # 👇 서버 시작 스크립트 지정
    - location: scripts/start_server.sh
      timeout: 300
      runas: root
